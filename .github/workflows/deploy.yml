name: Deploy

# Builds the React app on every merge to main and publishes main + frontend/dist as the
# `deploy` branch. PythonAnywhere runs `deploy` (its webhook checks it out on every push).
# Nobody commits to `deploy` by hand: it is replaced on every run.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # /api/health reads this, so anyone can see which commit is live.
      - run: echo "$GITHUB_SHA" > frontend/dist/commit.txt
      - name: Publish the deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create deploy
          git add --force frontend/dist
          git commit --message "Deploy ${GITHUB_SHA::7}: main with the React build"
          git push --force origin deploy
