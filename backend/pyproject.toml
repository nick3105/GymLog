[project]
name = "gymlog"
version = "0.1.0"
description = "GymLog API: workout templates, sessions and body weight."
requires-python = ">=3.12"
dependencies = ["flask>=3.1,<4"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.14"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter wraps code to line-length; long SQL and message strings stay intact.
ignore = ["E501"]
